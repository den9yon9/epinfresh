name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epinfresh
          POSTGRES_PASSWORD: epinfresh
          POSTGRES_DB: epinfresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U epinfresh
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Check format & lint
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      - name: Run migrations
        run: pnpm --filter @epinfresh/database db:migrate
        env:
          DATABASE_URL: postgres://epinfresh:epinfresh@localhost:5432/epinfresh
          NODE_ENV: test
