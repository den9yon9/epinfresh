name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epinfresh
          POSTGRES_PASSWORD: epinfresh
          POSTGRES_DB: epinfresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epinfresh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段决定, 显式传 version 会与之冲突
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          version: '1.3.14'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Check format & lint
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          TESTING_DATABASE_URL: postgres://epinfresh:epinfresh@localhost:5432/epinfresh_test
          TESTING_REDIS_URL: redis://localhost:6379/1
          TESTING_SESSION_SECRET: test-session-secret-0123456789abcdef
          NODE_ENV: test

      # 覆盖率只报告不设门槛: 看见盲区即可, 数字指标容易异化为刷分
      - name: Test coverage report
        run: pnpm exec turbo test --concurrency=1 -- --coverage
        env:
          TESTING_DATABASE_URL: postgres://epinfresh:epinfresh@localhost:5432/epinfresh_test
          TESTING_REDIS_URL: redis://localhost:6379/1
          TESTING_SESSION_SECRET: test-session-secret-0123456789abcdef
          NODE_ENV: test

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      - name: Run migrations
        run: pnpm --filter @epinfresh/database db:migrate
        env:
          DATABASE_URL: postgres://epinfresh:epinfresh@localhost:5432/epinfresh
          NODE_ENV: test

      - name: Prepare .env for e2e
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgres://epinfresh:epinfresh@localhost:5432/epinfresh
          REDIS_URL=redis://localhost:6379
          SESSION_SECRET=test-session-secret-0123456789abcdef
          LOG_LEVEL=silent
          CORS_ORIGIN=*
          TRUST_PROXY=false
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=admin123456
          STOREFRONT_PORT=3000
          ADMIN_PORT=3001
          TESTING_DATABASE_URL=postgres://epinfresh:epinfresh@localhost:5432/epinfresh_test
          TESTING_REDIS_URL=redis://localhost:6379/1
          TESTING_SESSION_SECRET=test-session-secret-0123456789abcdef
          SHIPPING_FLAT_FEE=6.00
          FREE_SHIPPING_THRESHOLD=88.00
          EOF

      - name: Seed admin and fixtures
        run: |
          pnpm --filter @epinfresh/database db:seed
          pnpm --filter @epinfresh/database db:fixtures

      - name: Install Playwright browser
        run: pnpm --filter @epinfresh/e2e exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e
        env:
          NODE_ENV: test

      - name: Build & smoke test docker image
        run: |
          docker build --build-arg APP=storefront-api -t epinfresh-smoke .
          docker run -d --name epinfresh-smoke --network=host \
            -e DATABASE_URL=postgres://epinfresh:epinfresh@localhost:5432/epinfresh_test \
            -e REDIS_URL=redis://localhost:6379/1 \
            -e SESSION_SECRET=test-session-secret-0123456789abcdef \
            -e NODE_ENV=test \
            -e CORS_ORIGIN='*' \
            -e TRUST_PROXY=false \
            -e STOREFRONT_PORT=3000 \
            -e LOG_LEVEL=silent \
            epinfresh-smoke
          for i in $(seq 1 30); do
            if docker exec epinfresh-smoke wget -q -O /dev/null http://localhost:3000/health; then
              echo "health ok"
              docker rm -f epinfresh-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs epinfresh-smoke
          docker rm -f epinfresh-smoke
          exit 1
