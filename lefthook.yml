pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,mjs,cjs,d.ts,json,yml,yaml,md}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      run: pnpm lint

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
