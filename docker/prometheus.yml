# Prometheus 抓取配置: 采集 epinfresh 三个服务的 /metrics 端点。
# 端口可用环境变量覆盖(默认 host.docker.internal 指向宿主机, 本地 compose 场景无需改);
# brew 本机运行时把 host.docker.internal 换成 localhost 即可(prometheus 直接访问本机端口)。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: storefront-api
    static_configs:
      - targets: ['${STORE_METRICS_TARGET:-host.docker.internal:3000}']

  - job_name: admin-api
    static_configs:
      - targets: ['${ADMIN_METRICS_TARGET:-host.docker.internal:3001}']

  # worker 需在 .env 启用 HEALTH_PORT(默认 3100)后才暴露 /metrics
  - job_name: worker
    static_configs:
      - targets: ['${WORKER_METRICS_TARGET:-host.docker.internal:3100}']
