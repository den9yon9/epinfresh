apiVersion: 1

# 原生本机 Grafana 直连本机 Prometheus(localhost:9090)。
# Docker 场景由 docker/docker-compose.observability.yml 覆盖挂载 datasources.docker.yml(url: http://prometheus:9090)。
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
