# Prometheus 抓取配置(原生优先, 单一事实源): 采集 epinfresh 三个服务的 /metrics 端点。
# 目标固定为本机 localhost(brew 本机运行直接可用); 端口调整直接改这里的 :3000/:3001/:3100。
# 注意: Prometheus 配置文件不支持 ${VAR} 环境变量替换; Docker 场景请使用
# docker/prometheus.docker.yml(容器内用 host.docker.internal 访问宿主机)。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: storefront-api
    static_configs:
      - targets: ['localhost:3000']

  - job_name: admin-api
    static_configs:
      - targets: ['localhost:3001']

  # worker 需在 .env 启用 HEALTH_PORT(默认 3100)后才暴露 /metrics
  - job_name: worker
    static_configs:
      - targets: ['localhost:3100']
